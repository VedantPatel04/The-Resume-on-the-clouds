name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run typecheck
      - name: Build static site
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # Requires these repo secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
      # AWS_REGION, S3_BUCKET_NAME, CLOUDFRONT_DISTRIBUTION_ID
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync build to S3
        run: >-
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }}
          --delete
          --exclude "index.html"
          --cache-control "public,max-age=31536000,immutable"

      - name: Upload entry point without long-lived caching
        run: >-
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html
          --content-type "text/html; charset=utf-8"
          --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
